# ----------------------------------------------------------------------------
# Project / JVM
# ----------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# ----------------------------------------------------------------------------
# Toolchain versions  (taken from the jar's MANIFEST.MF)
# ----------------------------------------------------------------------------
minecraft_version=1.21.11
loader_version=0.18.4
# ----------------------------------------------------------------------------
# Mod metadata (mirrors fabric.mod.json)
# ----------------------------------------------------------------------------
mod_version=3.465
maven_group=org.BetterClimbing
archives_base_name=better-climbing

# Yarn mappings build number.
#   The exact build is resolved automatically if you run tools/remap_to_named.sh.
#   Otherwise pick the matching build for 1.21.11 from https://fabricmc.net/develop
#   and replace the placeholder below.
yarn_mappings=1.21.11+build.1

# Fabric API version for 1.21.11 (also listed on https://fabricmc.net/develop ).
#   The mod depends on Fabric API (events, networking, key bindings, etc.).
fabric_version=0.140.0+1.21.11

# Optional integrations used by the mod's code (1.21.11)
modmenu_version=17.0.0
cloth_config_version=21.11.153











